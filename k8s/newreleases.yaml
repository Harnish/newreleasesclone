---
# Persistent storage for SQLite database.
# Uses k3s default local-path provisioner.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: newreleases-data
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 512Mi
  storageClassName: local-path

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: newreleases
  namespace: default
  labels:
    app: newreleases
spec:
  replicas: 1
  selector:
    matchLabels:
      app: newreleases
  template:
    metadata:
      labels:
        app: newreleases
    spec:
      containers:
        - name: newreleases
          image: registry.whiskeyonthe.rocks/newreleases/newreleases:dev
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          # Uncomment and set to your own GitLab hostname(s) if your GitLab
          # instance resolves to a private/cluster-internal address from
          # here (split-horizon DNS or a k8s service name) — see README's
          # Environment Variables section.
          # env:
          #   - name: GITLAB_ALLOWED_HOSTS
          #     value: "gitlab.whiskeyonthe.rocks"
          volumeMounts:
            - name: data
              mountPath: /app/data
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "250m"
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: newreleases-data

---
apiVersion: v1
kind: Service
metadata:
  name: newreleases
  namespace: default
spec:
  selector:
    app: newreleases
  ports:
    - port: 80
      targetPort: 8080
  type: ClusterIP
