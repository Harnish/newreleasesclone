stages:
  - build
  - test
  - push
  - deploy

variables:
  REGISTRY: registry.gitlab.com
  IMAGE_NAME: ${REGISTRY}/${CI_PROJECT_PATH}
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: "/certs"

# Build stage with Buildah
build_with_buildah:
  stage: build
  image: quay.io/buildah/stable:latest
  variables:
    BUILDAH_LAYERS: "true"
    BUILDAH_ISOLATION: "chroot"
  script:
    - echo "Building image with Buildah..."
    - buildah bud -t ${IMAGE_NAME}:${CI_COMMIT_SHORT_SHA} -t ${IMAGE_NAME}:latest -f Dockerfile .
    - buildah images | grep ${IMAGE_NAME}
  artifacts:
    reports:
      dotenv: build.env
  only:
    - branches
    - tags

# Build stage with Podman
build_with_podman:
  stage: build
  image: podman:latest
  variables:
    PODMAN_USERNS: "keep-id"
  script:
    - echo "Building image with Podman..."
    - podman build -t ${IMAGE_NAME}:${CI_COMMIT_SHORT_SHA} -t ${IMAGE_NAME}:latest -f Dockerfile .
    - podman images | grep ${IMAGE_NAME}
  artifacts:
    reports:
      dotenv: build.env
  only:
    - branches
    - tags

# Test stage - Run unit tests
test_unit:
  stage: test
  image: golang:1.24.9-alpine
  script:
    - echo "Running unit tests..."
    - apk add --no-cache git curl
    - go test -v -race -coverprofile=coverage.out ./...
    - go tool cover -func coverage.out
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.out
    paths:
      - coverage.out
    expire_in: 30 days
  coverage: '/coverage: \d+\.\d+% of statements/'
  only:
    - branches
    - tags

# Test stage - Build and test in container
test_container:
  stage: test
  image: ${REGISTRY}/${CI_PROJECT_PATH}:${CI_COMMIT_SHORT_SHA}
  script:
    - echo "Testing container..."
    - /app/newreleases --help || true
    - wget -q -O- http://localhost:8080/api/projects || true
  allow_failure: true
  only:
    - branches
    - tags

# Lint stage - Run golangci-lint
lint:
  stage: test
  image: golang:1.24.9-alpine
  script:
    - echo "Running linters..."
    - apk add --no-cache git
    - go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest
    - golangci-lint run ./...
  allow_failure: true
  only:
    - branches
    - tags

# Security scan stage - Trivy
security_scan:
  stage: test
  image: aquasec/trivy:latest
  script:
    - echo "Running security scan..."
    - trivy image --severity HIGH,CRITICAL ${IMAGE_NAME}:${CI_COMMIT_SHORT_SHA} || true
  allow_failure: true
  only:
    - branches
    - tags

# Push to GitLab Registry (on merge to main/master)
push_to_registry:
  stage: push
  image: quay.io/buildah/stable:latest
  before_script:
    - echo ${CI_REGISTRY_PASSWORD} | buildah login -u ${CI_REGISTRY_USER} --password-stdin ${CI_REGISTRY}
  script:
    - echo "Pushing image to GitLab Registry..."
    - buildah push ${IMAGE_NAME}:${CI_COMMIT_SHORT_SHA} docker://${IMAGE_NAME}:${CI_COMMIT_SHORT_SHA}
    - buildah push ${IMAGE_NAME}:latest docker://${IMAGE_NAME}:latest
    - |
      if [[ -n "$CI_COMMIT_TAG" ]]; then
        buildah push ${IMAGE_NAME}:${CI_COMMIT_SHORT_SHA} docker://${IMAGE_NAME}:${CI_COMMIT_TAG}
      fi
    - echo "Image pushed: ${IMAGE_NAME}:${CI_COMMIT_SHORT_SHA}"
  only:
    - main
    - master
    - tags

# Push to Docker Hub (on tags)
push_to_dockerhub:
  stage: push
  image: quay.io/buildah/stable:latest
  before_script:
    - echo ${DOCKERHUB_TOKEN} | buildah login -u ${DOCKERHUB_USER} --password-stdin docker.io
  script:
    - echo "Pushing image to Docker Hub..."
    - buildah push ${IMAGE_NAME}:${CI_COMMIT_SHORT_SHA} docker://docker.io/${DOCKERHUB_USER}/newreleases:${CI_COMMIT_SHORT_SHA}
    - buildah push ${IMAGE_NAME}:latest docker://docker.io/${DOCKERHUB_USER}/newreleases:latest
    - |
      if [[ -n "$CI_COMMIT_TAG" ]]; then
        buildah push ${IMAGE_NAME}:${CI_COMMIT_SHORT_SHA} docker://docker.io/${DOCKERHUB_USER}/newreleases:${CI_COMMIT_TAG}
      fi
  only:
    - tags
  when: manual

# Deploy to staging (manual)
deploy_staging:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - echo "${SSH_PRIVATE_KEY}" > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - ssh-keyscan -H ${STAGING_HOST} >> ~/.ssh/known_hosts
  script:
    - echo "Deploying to staging..."
    - ssh ${STAGING_USER}@${STAGING_HOST} "cd ${STAGING_PATH} && docker-compose pull && docker-compose up -d"
    - echo "Deployment complete!"
  environment:
    name: staging
    url: http://${STAGING_HOST}:8080
  only:
    - main
    - master
  when: manual

# Deploy to production (manual)
deploy_production:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - echo "${SSH_PRIVATE_KEY}" > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - ssh-keyscan -H ${PRODUCTION_HOST} >> ~/.ssh/known_hosts
  script:
    - echo "Deploying to production..."
    - ssh ${PRODUCTION_USER}@${PRODUCTION_HOST} "cd ${PRODUCTION_PATH} && docker-compose pull && docker-compose up -d"
    - echo "Deployment complete!"
  environment:
    name: production
    url: http://${PRODUCTION_HOST}:8080
  only:
    - tags
  when: manual

# Release job - Create release on tag
release:
  stage: deploy
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  script:
    - echo "Creating GitLab release..."
  release:
    tag_name: $CI_COMMIT_TAG
    name: "Release $CI_COMMIT_TAG"
    description: |
      ## Release $CI_COMMIT_TAG

      ### Docker Image
      - **GitLab Registry**: `${REGISTRY}/${CI_PROJECT_PATH}:${CI_COMMIT_TAG}`
      - **Docker Hub**: `${DOCKERHUB_USER}/newreleases:${CI_COMMIT_TAG}`

      ### Changes
      See commit history for detailed changes.
    ref: $CI_COMMIT_SHA
    milestones:
      - $CI_COMMIT_TAG
  only:
    - tags
